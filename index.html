<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>WBX PANEL - READY TO GO</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { background: #050008; color: #d9b3ff; font-family: sans-serif; text-align: center; padding: 20px; }
        .box { background: #000; border: 2px solid #482ff7; padding: 20px; border-radius: 15px; max-width: 400px; margin: auto; box-shadow: 0 0 15px rgba(72, 47, 247, 0.3); }
        h2 { text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; }
        label { display: block; text-align: left; font-size: 11px; color: #888; margin: 5px 0 0 5px; }
        input { display: block; width: 100%; margin: 5px 0 15px 0; padding: 12px; background: #1a1a1a; color: white; border: 1px solid #333; border-radius: 5px; box-sizing: border-box; outline: none; }
        input:focus { border-color: #482ff7; }
        button { width: 100%; padding: 15px; background: #482ff7; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; }
        button:hover { background: #351ec1; }
        .status { margin-top: 15px; font-size: 13px; padding: 10px; border-radius: 5px; display: none; word-break: break-all; }
        .success { display: block; background: rgba(0, 255, 150, 0.1); border: 1px solid #00ff96; color: #00ff96; }
        .error { display: block; background: rgba(255, 0, 50, 0.1); border: 1px solid #ff0032; color: #ff0032; }
        
        /* Stili per la schermata di Login */
        #login-box { display: block; }
        #admin-panel { display: none; }
    </style>
</head>
<body>

<!-- SCHERMATA DI LOGIN -->
<div id="login-box" class="box">
    <h2>Accesso Riservato</h2>
    <label>USERNAME</label>
    <input type="text" id="login-user" placeholder="Inserisci username">
    
    <label>PASSWORD</label>
    <input type="password" id="login-pass" placeholder="Inserisci password">
    
    <button onclick="checkLogin()">ACCEDI</button>
    <div id="login-status" class="status"></div>
</div>

<!-- PANNELLO ADMIN (Nascosto di default) -->
<div id="admin-panel" class="box">
    <h2>Werblyx Admin</h2>
    
    <p style="font-size: 12px; color: #00ff96; text-align: left; margin: 0 0 15px 5px;">
        ✓ Credenziali GitHub caricate internamente
    </p>

    <label>NEW USERNAME</label>
    <input type="text" id="u" placeholder="Username">
    
    <label>NEW PASSWORD</label>
    <input type="text" id="p" placeholder="Password">
    
    <label>VALIDITY (Days - 0 for PERMANENT)</label>
    <input type="number" id="d" value="0">

    <button onclick="addAccount()">ADD ACCOUNT NOW</button>
    
    <div id="status" class="status"></div>
</div>

<script>
    // ==========================================
    // CONFIGURAZIONE STATICA CREDENZIALI GITHUB
    // Sostituisci i valori tra virgolette con i tuoi dati reali
    // ==========================================
    const GITHUB_TOKEN = "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"; 
    const GITHUB_REPO  = "H4Z3-byte/Werblyx"; 
    // ==========================================

    const ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";

    // Controllo sessione all'avvio
    window.onload = function() {
        if(sessionStorage.getItem('wbx_logged') === 'true') {
            showPanel();
        }
    };

    // Funzione per verificare le credenziali d'accesso locali
    function checkLogin() {
        const user = document.getElementById('login-user').value.trim();
        const pass = document.getElementById('login-pass').value;
        const loginStatus = document.getElementById('login-status');

        if(user === "btween" && pass === "Creatores!") {
            sessionStorage.setItem('wbx_logged', 'true');
            showPanel();
        } else {
            loginStatus.innerText = "Credenziali errate! Accesso negato.";
            loginStatus.className = "status error";
        }
    }

    // Mostra il pannello principale e nasconde il login
    function showPanel() {
        document.getElementById('login-box').style.display = 'none';
        document.getElementById('admin-panel').style.display = 'block';
    }

    async function addAccount() {
        // Blocco di sicurezza ulteriore basato sulla sessione
        if(sessionStorage.getItem('wbx_logged') !== 'true') {
            alert("Azione non autorizzata!");
            location.reload();
            return;
        }

        const u = document.getElementById('u').value.trim();
        const p = document.getElementById('p').value.trim();
        const d = parseInt(document.getElementById('d').value);
        const status = document.getElementById('status');

        // Verifica la presenza delle variabili statiche e dei campi utente
        if(GITHUB_TOKEN === "IL_TUO_NUOVO_TOKEN_QUI" || !GITHUB_REPO) {
            showStatus("ERRORE: Configura prima il token nel codice JavaScript!", "error");
            return;
        }

        if(!u || !p) {
            showStatus("ERRORE: Riempi tutti i campi dell'account!", "error");
            return;
        }

        showStatus("In corso...", "");

        const encoded = "DX_" + encode(`${u}:${p}`);
        let expiry = (d === 0) ? "PERMANENT" : new Date(Date.now() + d * 86400000).toISOString().split('T')[0];

        try {
            // 1. Aggiorna accountdata.txt usando le costanti
            await updateFile(GITHUB_TOKEN, GITHUB_REPO, 'accountdata.txt', (content) => {
                let lines = content ? content.split('\n').filter(l => l.trim()) : [];
                if(!lines.includes(encoded)) lines.push(encoded);
                return lines.join('\n');
            });

            // 2. Aggiorna expiry_log.json usando le costanti
            await updateFile(GITHUB_TOKEN, GITHUB_REPO, 'expiry_log.json', (content) => {
                let log = {};
                try {
                    log = (content && content.trim()) ? JSON.parse(content) : {};
                } catch(e) { log = {}; }
                
                log[encoded] = expiry;
                return JSON.stringify(log, null, 2);
            });

            showStatus(`SUCCESSO: Account ${u} aggiunto!`, "success");
            document.getElementById('u').value = "";
            document.getElementById('p').value = "";
        } catch (e) {
            showStatus("ERRORE: " + e.message, "error");
        }
    }

    async function updateFile(token, repo, path, modifier) {
        const url = `https://api.github.com/repos/${repo}/contents/${path}`;
        const headers = { Authorization: `token ${token}`, 'Accept': 'application/vnd.github.v3+json' };
        
        let sha = "";
        let content = "";
        
        const res = await fetch(url, { headers });
        if(res.ok) {
            const data = await res.json();
            sha = data.sha;
            content = decodeURIComponent(escape(atob(data.content)));
        }

        const newText = modifier(content);
        const newContent = btoa(unescape(encodeURIComponent(newText)));

        const putRes = await fetch(url, {
            method: 'PUT',
            headers: { ...headers, 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: `Update ${path}`, content: newContent, sha: sha })
        });

        if(!putRes.ok) {
            const errData = await putRes.json();
            throw new Error(errData.message || `Errore su ${path}`);
        }
    }

    function encode(t) {
        let res = "";
        for (let i = 0; i < t.length; i++) {
            let v = (t.charCodeAt(i) ^ 0x7A);
            let shifted = (v + (i % 64)) % 256;
            res += ALPHABET[Math.floor(shifted/64)] + ALPHABET[shifted%64];
        }
        return res.split("").reverse().join("");
    }

    function showStatus(msg, type) {
        const s = document.getElementById('status');
        s.innerText = msg;
        s.className = "status " + type;
    }
</script>
</body>
</html>
