<!DOCTYPE html>
<html>
<head>
    <title>Werblyx Admin Panel</title>
    <style>
        body { background: #14001F; color: #E8D2FF; font-family: sans-serif; padding: 40px; text-align: center; }
        .box { background: #000; border: 1px solid #D9B3FF; padding: 20px; border-radius: 10px; display: inline-block; width: 450px; }
        input { width: 80%; padding: 10px; margin: 10px; border-radius: 5px; border: none; }
        .code-box { background: #1a1a1a; padding: 10px; margin: 10px; font-size: 11px; color: #00FFC2; word-break: break-all; border: 1px solid #333; text-align: left; }
        h3 { font-size: 14px; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Werblyx Account Manager</h2>
        <input type="text" id="u" placeholder="Username">
        <input type="text" id="p" placeholder="Password">
        <input type="number" id="d" placeholder="Days Valid" value="30">
        <button onclick="generate()">GENERA DATI</button>

        <div id="output" style="display:none; margin-top:20px;">
            <h3>Da aggiungere a <b>accountdata.txt</b>:</h3>
            <div class="code-box" id="clientLine"></div>
            
            <h3>Da aggiungere a <b>expiry_log.json</b>:</h3>
            <div class="code-box" id="jsonLine"></div>
        </div>
    </div>

<script>
    const ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
    function generate() {
        const u = document.getElementById('u').value;
        const p = document.getElementById('p').value;
        const d = parseInt(document.getElementById('d').value);
        
        // Codifica standard per il client (solo USER:PASS)
        const encoded = "DX_" + encode(`${u}:${p}`);
        
        // Calcola data scadenza
        const date = new Date();
        date.setDate(date.getDate() + d);
        const expiryDate = date.toISOString().split('T')[0];

        document.getElementById('output').style.display = 'block';
        document.getElementById('clientLine').innerText = encoded;
        // Crea la riga JSON
        document.getElementById('jsonLine').innerText = `"${encoded}": "${expiryDate}"`;
    }

    function encode(t) {
        let res = "";
        for (let i = 0; i < t.length; i++) {
            let v = (t.charCodeAt(i) ^ 0x7A);
            let shifted = (v + (i % 64)) % 256;
            res += ALPHABET[Math.floor(shifted/64)] + ALPHABET[shifted%64];
        }
        return res.split("").reverse().join("");
    }
</script>
</body>
</html>
